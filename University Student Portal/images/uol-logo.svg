<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- White Background with subtle border -->
  <rect width="360" height="360" rx="16" fill="#ffffff"/>

  <!-- GREEN WHEAT / LEAF STALK ON LEFT (#198744) -->
  <g fill="#198744">
    <!-- Curved Main Stem -->
    <path d="M58 45 C52 125, 52 185, 92 205 C70 198, 56 175, 58 45 Z"/>
    <!-- Center Top Leaf -->
    <path d="M56 32 C49 48, 53 62, 56 68 C60 62, 63 48, 56 32 Z"/>
    <!-- Left Leaves (5 pairs) -->
    <path d="M54 78 C38 68, 34 55, 34 52 C46 56, 54 66, 55 76 Z"/>
    <path d="M54 104 C36 94, 32 80, 32 76 C45 81, 53 92, 55 102 Z"/>
    <path d="M55 130 C36 120, 32 106, 32 102 C45 107, 53 118, 56 128 Z"/>
    <path d="M57 156 C38 146, 33 132, 33 128 C46 133, 55 144, 58 154 Z"/>
    <path d="M62 180 C42 172, 35 160, 34 155 C48 159, 58 168, 63 178 Z"/>
    <!-- Right Leaves (5 pairs) -->
    <path d="M57 78 C70 67, 75 55, 76 50 C64 55, 57 66, 56 76 Z"/>
    <path d="M57 104 C72 93, 78 80, 79 75 C66 80, 58 92, 56 102 Z"/>
    <path d="M58 130 C73 119, 79 106, 80 101 C67 106, 59 118, 57 128 Z"/>
    <path d="M60 156 C75 145, 81 132, 82 127 C69 132, 61 144, 59 154 Z"/>
    <path d="M65 180 C79 170, 85 158, 86 153 C73 157, 65 168, 63 178 Z"/>
  </g>

  <!-- ORANGE 'U' AND 'L' MONOGRAM (#F39019) -->
  <g fill="#F39019">
    <!-- Left thick vertical & curve of U -->
    <path d="M86 28 L116 28 L116 148 C116 175, 144 176, 144 148 L144 28 L149 28 L149 150 C149 184, 110 185, 95 168 C88 160, 86 148, 86 135 Z"/>
    <!-- Outer U / Middle Pillar with Swoosh -->
    <path d="M166 28 L194 28 L194 152 C194 188, 165 208, 134 210 C158 195, 166 178, 166 150 Z"/>
    <!-- Bottom Orange Crescent Swoosh under Wheat & U -->
    <path d="M35 175 C65 225, 155 232, 192 178 C172 238, 68 242, 35 175 Z"/>
    <!-- Right 'L' Pillar & Base -->
    <path d="M200 28 L242 28 L228 40 L228 192 L318 192 L314 196 L223 196 L206 214 L334 214 L322 230 L186 230 L200 194 Z"/>
  </g>

  <!-- TECH NETWORK NODES ON TOP RIGHT -->
  <g stroke="#212121" stroke-width="4" stroke-linecap="round">
    <line x1="278" y1="118" x2="245" y2="65"/>
    <line x1="278" y1="118" x2="242" y2="96"/>
    <line x1="278" y1="118" x2="246" y2="136"/>
    <line x1="278" y1="118" x2="276" y2="60"/>
    <line x1="276" y1="60" x2="312" y2="48"/>
    <line x1="278" y1="118" x2="326" y2="82"/>
    <line x1="278" y1="118" x2="326" y2="142"/>
    <line x1="278" y1="118" x2="302" y2="165"/>
  </g>
  <!-- Dark Nodes -->
  <g fill="#212121">
    <circle cx="278" cy="118" r="8"/>
    <circle cx="245" cy="65" r="14"/>
    <circle cx="242" cy="96" r="9"/>
    <circle cx="246" cy="136" r="13"/>
    <circle cx="312" cy="48" r="10"/>
    <circle cx="326" cy="82" r="12"/>
    <circle cx="326" cy="142" r="11"/>
    <circle cx="302" cy="165" r="10"/>
  </g>
  <!-- Orange Accent Nodes -->
  <g fill="#F39019">
    <circle cx="274" cy="39" r="13"/>
    <circle cx="292" cy="79" r="9"/>
    <circle cx="274" cy="160" r="6.5"/>
  </g>

  <!-- TYPOGRAPHY: UNIVERSITY OF LAYYAH 2022 -->
  <text x="180" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="900" fill="#212121" text-anchor="middle" letter-spacing="1">UNIVERSITY</text>
  <text x="180" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="900" fill="#212121" text-anchor="middle" letter-spacing="1.5">OF LAYYAH</text>

  <!-- 2022 + Horizontal Double Bars -->
  <line x1="32" y1="338" x2="148" y2="338" stroke="#212121" stroke-width="3"/>
  <line x1="32" y1="350" x2="148" y2="350" stroke="#212121" stroke-width="3"/>
  <text x="180" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#212121" text-anchor="middle">2022</text>
  <line x1="212" y1="338" x2="328" y2="338" stroke="#212121" stroke-width="3"/>
  <line x1="212" y1="350" x2="328" y2="350" stroke="#212121" stroke-width="3"/>
</svg>
